# Two-stage gate: pre-commit runs fast lint/format; pre-push runs slow tests
# in parallel. Tests on push (not commit) keeps the local feedback loop snappy.
pre-commit:
  parallel: true
  commands:
    prettier-check:
      glob: '*.{ts,tsx,astro,mjs,cjs,js,json,md,css,yml,yaml}'
      run: bun x prettier --check {staged_files}

    eslint:
      glob: '*.{ts,tsx,astro,mjs,cjs,js}'
      run: bun x eslint {staged_files}

    deno-fmt-check:
      glob: 'packages/mock-api/**/*.{ts,md,json}'
      run: deno fmt --check {staged_files}

    deno-lint:
      glob: 'packages/mock-api/**/*.ts'
      run: deno lint {staged_files}

    # Sprint-009: tsc + astro check on staged TS/Astro changes. Runs
    # whole-project typecheck (tsc needs the full graph; the staged-file
    # glob only gates *whether* the command runs, not its scope). Measured
    # ~6s wall time (Astro check is the long pole; Qwik tsc finishes first
    # under the parallel filter); user accepted the budget bust for the
    # casing-error class of bugs vitest doesn't catch.
    typecheck:
      glob: '*.{ts,tsx,astro}'
      run: bun run typecheck
      stage_fixed: false

# pre-push runs the slow build+test commands. pre-commit targets ~6s (the
# typecheck block above is the long pole; lint/format are <1s on staged
# files); tests live on push to keep commit feedback snappy.
# test-mock-api joins so all test commands run at the same gate.
pre-push:
  parallel: true
  commands:
    test-astro:
      # Match nested files AND top-level files (apps/astro/server.ts,
      # astro.config.mjs, package.json, etc.) — '**/*' alone misses the latter.
      glob:
        - 'apps/astro/*'
        - 'apps/astro/**/*'
      exclude:
        - 'apps/astro/docs/*'
        - 'apps/astro/docs/**/*'
      run: bun --filter aje-poc-astro test
      stage_fixed: false

    test-qwik:
      glob:
        - 'apps/qwik/*'
        - 'apps/qwik/**/*'
      exclude:
        - 'apps/qwik/docs/*'
        - 'apps/qwik/docs/**/*'
      run: bun --filter aje-poc-qwik test
      stage_fixed: false

    test-mock-api:
      glob: 'packages/mock-api/**/*.ts'
      # root: scopes lefthook to the Deno workspace so `deno task test` runs
      # from the package root (where deno.json lives, not the repo root).
      root: 'packages/mock-api/'
      run: deno task test
      stage_fixed: false
