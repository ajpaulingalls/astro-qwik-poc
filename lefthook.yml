pre-commit:
  parallel: true
  commands:
    prettier-check:
      glob: '*.{ts,tsx,astro,mjs,cjs,js,json,md,css,yml,yaml}'
      run: bun x prettier --check {staged_files}

    eslint:
      glob: '*.{ts,tsx,astro,mjs,cjs,js}'
      run: bun x eslint {staged_files}

    deno-fmt-check:
      glob: 'packages/mock-api/**/*.{ts,md,json}'
      run: deno fmt --check {staged_files}

    deno-lint:
      glob: 'packages/mock-api/**/*.ts'
      run: deno lint {staged_files}

# pre-push runs the slow build+test commands. pre-commit must stay <5s on
# staged-file workspace; tests moved here to unblock the tripwire.
# test-mock-api joins so all test commands run at the same gate.
pre-push:
  parallel: true
  commands:
    test-astro:
      # Match nested files AND top-level files (apps/astro/server.ts,
      # astro.config.mjs, package.json, etc.) — '**/*' alone misses the latter.
      glob:
        - 'apps/astro/*'
        - 'apps/astro/**/*'
      exclude:
        - 'apps/astro/docs/*'
        - 'apps/astro/docs/**/*'
      # Source nvm + use Node 22 (per .nvmrc) — `test` chains `build` which
      # requires Node >=22.12.0 (Astro 6 engine). Same wrapper as test-qwik.
      run: bash -c 'source ~/.nvm/nvm.sh && nvm use > /dev/null && bun --filter aje-poc-astro test'
      stage_fixed: false

    test-qwik:
      glob:
        - 'apps/qwik/*'
        - 'apps/qwik/**/*'
      exclude:
        - 'apps/qwik/docs/*'
        - 'apps/qwik/docs/**/*'
      # Source nvm + use Node 22 (per .nvmrc) so the acceptance test's
      # `node --experimental-strip-types server.ts` spawn works in a
      # subshell that wouldn't otherwise pick up nvm.
      run: bash -c 'source ~/.nvm/nvm.sh && nvm use > /dev/null && bun --filter aje-poc-qwik test'
      stage_fixed: false

    test-mock-api:
      glob: 'packages/mock-api/**/*.ts'
      # root: scopes lefthook to the Deno workspace so `deno task test` runs
      # from the package root (where deno.json lives, not the repo root).
      root: 'packages/mock-api/'
      run: deno task test
      stage_fixed: false
